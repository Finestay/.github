name: iOS Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'Finestay-Mobile/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'Finestay-Mobile/**'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Flutter iOS
    runs-on: macos-latest

    defaults:
      run:
        working-directory: Finestay-Mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: finestay-ios-build
          path: Finestay-Mobile/build/ios/iphoneos/Runner.app
          retention-days: 7
